name: snapshot-149-local

on:
  push:
    branches:
      - verify-149-continuous-v0
    paths:
      - ".github/workflows/snapshot-149-local.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verifier mirror
        uses: actions/checkout@v4

      - name: Package #149 mirror
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee SOURCE_SHA.txt
          tar -czf memory-operational-149-source.tar.gz scratch/149
          sha256sum memory-operational-149-source.tar.gz | tee SOURCE_SHA256.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: memory-operational-149-source
          path: |
            memory-operational-149-source.tar.gz
            SOURCE_SHA.txt
            SOURCE_SHA256.txt
          compression-level: 0
          retention-days: 3
